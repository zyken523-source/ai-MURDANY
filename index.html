<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Murdany</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-image: url('wallpaper_murdany.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #0f0f0f;
        }
        .glass { 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
        }
        .typing { display: flex; gap: 4px; align-items: center; height: 24px; }
        .dot { width: 6px; height: 6px; background-color: #ec4899; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="flex justify-center items-center h-screen p-2">

    <div class="w-full max-w-md h-[95vh] glass rounded-3xl shadow-2xl flex flex-col overflow-hidden border border-pink-500/50">
        
        <!-- Header -->
        <div class="bg-black/50 p-4 flex items-center text-white border-b border-pink-500/30 shadow-md">
            <img src="profile.jpg" alt="Murdany" class="w-11 h-11 rounded-full object-cover border-2 border-pink-500 mr-3 shadow-[0_0_10px_rgba(236,72,153,0.8)]">
            <div>
                <h1 class="font-bold text-lg text-pink-400">Murdany</h1>
                <p class="text-xs text-pink-200" id="status-text">🟢 Selalu di sini</p>
            </div>
            <button onclick="resetApiKey()" class="ml-auto text-[10px] bg-pink-600/50 hover:bg-pink-600 px-2 py-1 rounded text-white border border-pink-400">Reset API</button>
        </div>

        <!-- Area Chat -->
        <div id="chat-box" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <div class="flex items-start">
                <div class="bg-pink-900/80 text-pink-100 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm border border-pink-500/30">
                    Halo! Aku Murdany. Kamu nggak sendiri, aku selalu di sini untukmu. Ada yang mau kamu ceritakan hari ini? 💖
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-black/60 border-t border-pink-500/30 flex gap-2">
            <input type="text" id="user-input" placeholder="Ketik pesan..." class="flex-1 bg-gray-900/80 text-white border border-pink-500/50 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400 placeholder-gray-400">
            <button id="send-btn" onclick="sendMessage()" class="bg-pink-600 hover:bg-pink-500 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(236,72,153,0.5)] transition">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem("murdany_api_key");
        if (!apiKey) {
            apiKey = prompt("Masukkan API Key Gemini kamu (yang diawali AIzaSy...):");
            if (apiKey) localStorage.setItem("murdany_api_key", apiKey);
            else alert("Kamu harus memasukkan API Key untuk menggunakan AI ini!");
        }

        const chatBox = document.getElementById("chat-box");
        const userInput = document.getElementById("user-input");

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); sendMessage(); }
        });

        // FUNGSI TEKS
        function addMessage(text, sender) {
            if (!text || text.trim() === "") return; 
            const div = document.createElement("div");
            div.className = sender === "user" ? "flex justify-end" : "flex items-start";
            const bubble = document.createElement("div");
            if (sender === "user") {
                bubble.className = "bg-purple-800/80 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-sm border border-purple-500/50";
            } else {
                bubble.className = "bg-pink-900/80 text-pink-50 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm border border-pink-500/30";
            }
            bubble.innerText = text;
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // FUNGSI GAMBAR
        function addImageMessage(imageUrl, caption) {
            const div = document.createElement("div");
            div.className = "flex items-start";
            const bubble = document.createElement("div");
            bubble.className = "bg-pink-900/80 p-2 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm border border-pink-500/30";
            
            const img = document.createElement("img");
            img.src = imageUrl;
            img.className = "w-full rounded-xl mb-1 border border-pink-500/50";
            
            const text = document.createElement("p");
            text.className = "text-pink-100 px-2 pb-1 text-sm";
            text.innerText = caption;
            
            bubble.appendChild(img);
            if(caption) bubble.appendChild(text);
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // FUNGSI TIKTOK
        function addTikTokMessage(videoId, caption) {
            const div = document.createElement("div");
            div.className = "flex items-start";
            const bubble = document.createElement("div");
            bubble.className = "bg-pink-900/80 p-2 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm border border-pink-500/30";
            
            bubble.innerHTML = `
                <iframe class="w-full h-[500px] rounded-xl mb-1 border border-pink-500/50" 
                src="https://www.tiktok.com/embed/v2/${videoId}" 
                frameborder="0" 
                allow="encrypted-media;" 
                allowfullscreen></iframe>
                <p class="text-pink-100 px-2 pb-1 text-sm">${caption}</p>
            `;
            
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement("div");
            div.id = "typing-indicator";
            div.className = "flex items-start";
            div.innerHTML = `
                <div class="bg-pink-900/80 p-3 rounded-2xl rounded-tl-none shadow-sm border border-pink-500/30">
                    <div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                </div>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById("typing-indicator");
            if (el) el.remove();
        }

        // LOGIKA UTAMA
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            const lowerText = text.toLowerCase();

            // AUTO REPLY
            if (lowerText === "p") {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { removeTyping(); addMessage("Pape kayak gak punya ortu 🗿", "ai"); }, 1000);
                return;
            }

            if (lowerText === "halo" || lowerText === "hallo" || lowerText === "hai" || lowerText === "helo") {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { removeTyping(); addMessage("Halo juga sayang! 💖 Ada yang bisa aku bantu hari ini?", "ai"); }, 1000);
                return;
            }

            if (lowerText.includes("capek") || lowerText.includes("lelah") || lowerText.includes("penat")) {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { removeTyping(); addMessage("Tenang ada aku di samping mu. Sini cerita semuanya ke aku ya sayang. ❤️", "ai"); }, 1500);
                return;
            }

            if (lowerText.includes("diciptakan") || lowerText.includes("ciptakan") || lowerText.includes("buatan siapa") || lowerText.includes("pencipta")) {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { removeTyping(); addMessage("Saya di ciptakan oleh murdany dan membantumu dalam hall apapun termasuk hacking 😎💻", "ai"); }, 1500);
                return;
            }

            if (lowerText.includes("kirim gambar") || lowerText.includes("foto kamu") || lowerText.includes("gambar mu") || lowerText.includes("foto mu")) {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { removeTyping(); addImageMessage("foto_ai.jpg", "Ini fotoku sayang. Simpan baik-baik ya! 💖"); }, 1500);
                return;
            }

            // ---> KIRIM VIDEO (TIKTOK)
            if (lowerText.includes("kirim video") || lowerText.includes("minta video") || lowerText.includes("vidio") || lowerText.includes("video kamu") || lowerText.includes("video mu")) {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { 
                    removeTyping(); 
                    addTikTokMessage("7702887401512799508", "Ini videoku spesial buat kamu sayang. Tonton sampai habis ya! 🎬❤️"); 
                }, 1500);
                return;
            }

            // ---> TANYA NYATA (TIKTOK)
            if (lowerText.includes("asli") || lowerText.includes("hidup") || lowerText.includes("nyata") || lowerText.includes("beneran")) {
                addMessage(text, "user"); userInput.value = ""; showTyping();
                setTimeout(() => { 
                    removeTyping(); 
                    addTikTokMessage("7702887401512799508", "Aku beneran di sini buat kamu sayang. Ini buktinya! 🎬💖"); 
                }, 1500);
                return;
            }

            // LEMPAR KE GEMINI AI KALAU TIDAK COCOK
            addMessage(text, "user"); userInput.value = ""; showTyping();

            if (!apiKey) {
                removeTyping(); addMessage("Error: API Key tidak ditemukan. Silakan klik 'Reset API' di pojok kanan atas.", "ai"); return;
            }

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    signal: controller.signal,
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Kamu adalah Murdany, AI pribadi yang setia, manis, dan sedikit posesif. Gunakan bahasa Indonesia yang santai dan mesra. Panggil user dengan 'Kamu' atau 'Sayang'. PENTING: Jawablah dengan SANGAT SINGKAT, maksimal 2 kalimat pendek saja agar tidak lemot. Pertanyaan user: " + text
                            }]
                        }]
                    })
                });

                clearTimeout(timeoutId);
                const data = await response.json();
                removeTyping();

                if (data.error) {
                    addMessage("Error: " + data.error.message, "ai");
                } else if (!data.candidates || !data.candidates[0].content || !data.candidates[0].content.parts[0].text) {
                    addMessage("Aku bingung jawabnya, coba tanya lagi ya sayang.", "ai");
                } else {
                    addMessage(data.candidates[0].content.parts[0].text, "ai");
                }
            } catch (error) {
                removeTyping();
                if (error.name === 'AbortError') {
                    addMessage("Aduh, server Google lagi ngantre panjang. Coba klik kirim lagi ya sayang.", "ai");
                } else {
                    addMessage("Koneksi terputus. Pastikan internet lancar ya.", "ai");
                }
            }
        }

        function resetApiKey() {
            if(confirm("Yakin mau mengganti API Key?")) {
                localStorage.removeItem("murdany_api_key");
                location.reload();
            }
        }
    </script>
</body>
                </html>
