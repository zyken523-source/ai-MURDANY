<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Murdany</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #fce7f3; }
    </style>
</head>
<body class="flex justify-center items-center h-screen">

    <div class="w-full max-w-md h-[90vh] bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden border-4 border-pink-300">
        
        <div class="bg-pink-500 p-4 flex items-center text-white shadow-md">
            <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Murdany" alt="Murdany" class="w-10 h-10 rounded-full bg-white border-2 border-white mr-3">
            <div>
                <h1 class="font-bold text-lg">AI Murdany</h1>
                <p class="text-xs text-pink-100">🟢 Online</p>
            </div>
        </div>

        <div id="chat-box" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
            <div class="flex items-start">
                <div class="bg-pink-100 text-pink-900 p-3 rounded-2xl rounded-tl-none max-w-[80%] shadow-sm">
                    Halo! Aku Murdany, asisten AI pribadimu. Ada yang bisa aku bantu hari ini? 💖
                </div>
            </div>
        </div>

        <div class="p-3 bg-gray-50 border-t border-pink-200 flex gap-2">
            <input type="text" id="user-input" placeholder="Ketik pesan..." class="flex-1 border border-pink-300 rounded-full px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-400">
            <button id="send-btn" class="bg-pink-500 hover:bg-pink-600 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transition">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
            </button>
        </div>
    </div>

</body>
      </html>
